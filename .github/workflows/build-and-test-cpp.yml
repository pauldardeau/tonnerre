name: Build and test
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: make chaudiere
        run: make
        working-directory: chaudiere/src
      - name: make library
        run: make
        working-directory: src
      - name: make tests
        run: make
        working-directory: test
      - name: run-tests
        run: ./test_tonnerre
        working-directory: test

  cmake-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test (fast)
        run: ctest --test-dir build --output-on-failure -LE slow
      - name: Test (production default receive deadline, waits 10 s)
        # one scenario that waits out the whole 10 s default receive deadline
        # (label "slow"), kept out of the fast run so the wait is paid once
        run: ctest --test-dir build --output-on-failure -L slow --no-tests=error
